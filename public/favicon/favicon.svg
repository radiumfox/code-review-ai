<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1656"/>
      <stop offset="100%" stop-color="#0c0a28"/>
    </linearGradient>
    <linearGradient id="accentL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="100%" stop-color="#7b6ff2"/>
    </linearGradient>
    <linearGradient id="accentR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7b6ff2"/>
      <stop offset="100%" stop-color="#9b3ce8"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="55%" stop-color="#8a6ef2"/>
      <stop offset="100%" stop-color="#9b3ce8"/>
    </linearGradient>
    <linearGradient id="handle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5b6ff2"/>
      <stop offset="100%" stop-color="#7b3ce8"/>
    </linearGradient>
    <linearGradient id="check" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d6f3ff"/>
      <stop offset="100%" stop-color="#5fd4f0"/>
    </linearGradient>
  </defs>

  <!-- rounded-square app-icon background -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#bg)"/>

  <!-- magnifying glass handle (behind everything else at the joint) -->
  <path d="M 322 328 L 392 398" fill="none" stroke="#0a0824" stroke-width="54" stroke-linecap="round"/>
  <path d="M 322 328 L 392 398" fill="none" stroke="url(#handle)" stroke-width="38" stroke-linecap="round"/>

  <!-- left angle bracket < -->
  <path d="M 176 184 L 96 256 L 176 328" fill="none" stroke="#0a0824" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 176 184 L 96 256 L 176 328" fill="none" stroke="url(#accentL)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- right angle bracket > -->
  <path d="M 336 184 L 416 256 L 336 328" fill="none" stroke="#0a0824" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 336 184 L 416 256 L 336 328" fill="none" stroke="url(#accentR)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- magnifying glass lens -->
  <circle cx="256" cy="252" r="92" fill="#141034" stroke="#0a0824" stroke-width="46"/>
  <circle cx="256" cy="252" r="92" fill="#141034" stroke="url(#ring)" stroke-width="30"/>

  <!-- glossy highlight -->
  <path d="M 198 210 A 84 84 0 0 1 246 182" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.3"/>

  <!-- checkmark -->
  <path d="M 213 256 L 243 286 L 308 216" fill="none" stroke="#0a0824" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 213 256 L 243 286 L 308 216" fill="none" stroke="url(#check)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
